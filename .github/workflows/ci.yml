name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 用仓库根入口，保证 .env 插值与 env_file 行为一致（见根 docker-compose.yml 注释）
  COMPOSE_FILE: docker-compose.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读仓库内容。
#
# 为什么要显式声明：不声明时，仓库/组织的默认 GITHUB_TOKEN 权限可能是「读写全部」
# （取决于仓库设置），而本工作流的**每个 job 都只需要读代码** ——
# backend/frontend 是纯构建与测试，stack 是本地起 compose。
# 显式收紧到 contents: read 后，即使某个第三方 action 被投毒，
# 它也拿不到写权限去改代码/发 release。
#
# 注意：cd.yml 需要 push 镜像（packages: write）与写部署状态，因此**不在**这里统一收紧，
# 而是在该工作流内部按 job 声明其所需权限。
permissions:
  contents: read

jobs:
  backend:
    name: Backend (go build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          fmt_out=$(gofmt -l apps internal)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web-user

      # 文档一致性门禁（scripts/check-docs.mjs）。
      #
      # 为什么必须在这里跑：这个脚本早已存在，却**没有任何 CI job 执行它** ——
      # 于是它只在人工运行时才有作用（与「UI 守卫未进 CI」是同一类漏洞，见 PR #124）。
      #
      # 实测代价：设计交付物 docs/design/2026-09-20-console-rebuild/06-page-atlas.md
      # 的页面索引表里 64 个锚点全部写成了 `#g01` 这种短码，而真实标题是
      # `### G01 · 登录`（slug 为 `g01-登录`）—— 索引表在 GitHub 上**点了不跳转**，
      # 而 64 处失效没有任何自动化发现，直到本步骤把它接入 CI。
      #
      # 校验内容：相对链接可解析、同文档锚点有对应标题、代码引用路径真实存在。
      - name: Docs consistency (links + anchors)
        run: node scripts/check-docs.mjs

      # 契约冻结的 UI 守卫（test/l15_*.mjs）。
      #
      # 为什么必须在这里跑：这些脚本的默认路径是**源码级 + esbuild 渲染**断言，
      # 不需要任何容器，但此前**没有任何 CI job 执行它们** —— 于是它们只在
      # 人工运行时才有防回归作用。
      #
      # 实测代价：合并 PR #112 时，buildInfo.ts 引入 `import.meta.env` 的直接访问，
      # `npm run build`（tsc + vite build）**完全通过**（Vite 下它是正常的），
      # 却让两个 esbuild 渲染腿脚本崩溃（`Cannot read properties of undefined`）。
      # 若当时 CI 跑了这些脚本，那个回归会在合并前被拦住。
      #
      # 每个脚本默认路径都设计为「无容器可跑、exit code 决定成败」；
      # 需要真实 API/浏览器的断言在各自脚本里是 --with-api / --with-browser 可选分支，
      # 默认 [SKIP] 且不影响 exit code（详见各脚本头部说明）。
      - name: UI guards (frozen l15 tests, no container needed)
        run: |
          set -uo pipefail
          failed=0
          for t in stage_routes silent_guards capability_entries legacy_compatibility capability_coverage markdown_ui recipes_empty_state detail_context auth_redirect nmx_params \
                   artifact_download dataset_status app_ux cleaning_ux studio_shell studio_entrypoint studio_wizard \
                   studio_review studio_browser_router offline_queue team_permissions; do
            f="test/l15_${t}.mjs"
            [ -f "$f" ] || { echo "缺少冻结测试 $f"; failed=1; continue; }
            echo "=== $f ==="
            node "$f" || failed=1
          done
          exit $failed

      # 浏览器路由 E2E 的**断言结果**才是门禁（上一步），artifact 只是取证：
      # T32 明确要求「录屏/截图与断言结果附 CI artifact，不以截图代替断言」。
      - name: Upload browser-router E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-router-report
          path: test/artifacts/browser-router/report.json
          if-no-files-found: warn

  # 真实 DB 集成门禁（T32）。
  #
  # 为什么必须单独一个 job：Backend job 不提供 DSN，因此所有需要真实 Postgres
  # 的测试都会静默 `t.Skip` —— `go test` 全绿只证明「编译通过 + 单元测试通过」。
  # 而迁移、实验冻结、发布候选门槛、并发冻结、GRPO 质量路径**一条都没跑**。
  # 本 job 用 scripts/go-test-postgres.sh 起临时 Postgres、应用全部迁移，
  # 再由 scripts/check-integration-tests.sh 断言**必需的**集成测试真的执行了
  # （没有 `--- PASS` 即失败，显示为 Skip、被改名或包编译失败都会命中）。
  integration:
    name: Integration (real Postgres + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Postgres + migrations + required integration tests
        run: ./scripts/go-test-postgres.sh sh scripts/check-integration-tests.sh

  stack:
    name: Stack (compose up + migrate + healthz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: docker compose config >/dev/null
      - name: Boot stack
        run: docker compose up -d --build
      - name: Wait for api + worker health
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T api \
              wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1
            then
              echo "api healthy"
              docker compose exec -T worker \
                wget -qO- http://127.0.0.1:8081/healthz >/dev/null
              echo "worker healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::api did not become healthy"
          docker compose logs --tail=200
          exit 1
      # T32：不能只 `\dt`（那只证明「有表」）。必须核对
      #   * schema_migrations 与 sql/migrations 目录**一一对应**
      #     —— 少记一条会在下次启动时重复执行迁移；
      #   * 关键约束/索引真的建起来了（它们承载产品规则）。
      - name: Verify migrations recorded and key constraints exist
        run: |
          expected=$(find sql/migrations -name '*.sql' | wc -l | tr -d ' ')
          applied=$(docker compose exec -T postgres psql -tA -U llm_factory -d llm_factory \
            -c 'SELECT COUNT(*) FROM schema_migrations' | tr -d '[:space:]')
          echo "migrations applied=$applied expected=$expected"
          if [ "$applied" != "$expected" ]; then
            echo "::error::schema_migrations 有 $applied 行，而目录有 $expected 个迁移文件"
            docker compose exec -T postgres psql -U llm_factory -d llm_factory \
              -c 'SELECT filename FROM schema_migrations ORDER BY filename'
            exit 1
          fi
          for probe in \
            "uniq_experiment_score_current" \
            "trg_project_members_keep_owner" \
            "batches_blueprint_same_project" \
            "sample_versions_batch_item_fk"; do
            # 三类目录都要查：索引/表在 pg_class，触发器在 pg_trigger，
            # 外键/约束在 pg_constraint。只查 pg_class 会误报「缺少触发器/外键」。
            probe_sql="SELECT COUNT(*) FROM ("
            probe_sql="${probe_sql}SELECT relname AS name FROM pg_class UNION ALL "
            probe_sql="${probe_sql}SELECT tgname AS name FROM pg_trigger UNION ALL "
            probe_sql="${probe_sql}SELECT conname AS name FROM pg_constraint"
            probe_sql="${probe_sql}) catalog WHERE name = '${probe}'"
            found=$(docker compose exec -T postgres psql -tA -U llm_factory -d llm_factory \
              -c "$probe_sql" | tr -d '[:space:]')
            if [ "$found" = "0" ]; then
              echo "::error::迁移后缺少关键约束/索引 $probe"
              exit 1
            fi
          done
          echo "关键约束/索引齐全"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
