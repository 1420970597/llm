services:
  web-user:
    build:
      context: ../..
      dockerfile: deployments/docker/web-user.Dockerfile
      # 构建期注入 git 版本（issue #88）。
      #
      # 取值来源是仓库根的 .env（compose 从入口文件所在目录读 .env，
      # 根 docker-compose.yml 已把 project 目录固定在仓库根）。
      # 默认 unknown 而不是某个具体 SHA：构建方没传时，页面必须显式
      # 表现为「无法自证」，而不是看起来像当前源码。
      #
      # 为什么不在这里用 $(git rev-parse HEAD) 命令替换：compose 变量插值
      # 不做命令执行；而用 shell 包装又会把 `docker compose up -d --build`
      # 这条 README 里的标准命令变得不可移植。因此交给调用方传
      #（见 scripts/build-with-version.sh 与 README 的部署小节）。
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    ports:
      - "${WEB_USER_PORT:-3210}:80"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    # 所有配置统一从仓库根目录的 .env 读取（可选），缺失时回落到 internal/config 的内置默认值。
    # 注意：不要在此处用 ${VAR:-default} 重复声明同一批变量——compose 的 .env 插值
    # 以 compose 文件所在目录为基准，读不到仓库根 .env，而 environment 的优先级高于
    # env_file，会把根 .env 里的值（尤其是 APP_BOOTSTRAP_PROVIDER_*）覆盖成空。
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/worker.Dockerfile
    # 同 api：统一走 env_file，缺失时回落 internal/config 默认值。
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_factory}
      POSTGRES_USER: ${POSTGRES_USER:-llm_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_factory_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm_factory} -d ${POSTGRES_DB:-llm_factory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
