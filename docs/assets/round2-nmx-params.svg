<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title>n/m/x 生成参数：用户可控的三个层级与真实落库路径</title>
  <rect x="0" y="0" width="1040" height="520" fill="#ffffff"/>

  <text x="32" y="46" font-size="22" font-weight="700" fill="#1f2329">n / m / x 生成参数：用户可控的三个层级</text>
  <text x="32" y="74" font-size="13" fill="#646a73">功能说明.txt 步骤 1、3 逐字要求「其中 n 和 m 是用户可控的」「x 是用户可控的数量」</text>

  <!-- 层级：关键词 -> n 领域 -->
  <rect x="32" y="100" width="290" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="52" y="128" font-size="14" font-weight="700" fill="#2b4d8f">关键词</text>
  <text x="52" y="152" font-size="13" fill="#1f2329">军事</text>
  <text x="52" y="180" font-size="12" fill="#646a73">用户输入的起点</text>

  <!-- 箭头 1 -->
  <line x1="322" y1="152" x2="382" y2="152" stroke="#8f959e" stroke-width="2"/>
  <polygon points="382,146 394,152 382,158" fill="#8f959e"/>
  <text x="330" y="140" font-size="12" font-weight="700" fill="#d4380d">n</text>

  <!-- n：领域 -->
  <rect x="394" y="100" width="290" height="104" rx="10" fill="#fff7e6" stroke="#d48806" stroke-width="1.5"/>
  <text x="414" y="128" font-size="14" font-weight="700" fill="#8c5a00">n = 领域数</text>
  <text x="414" y="152" font-size="13" fill="#1f2329">海军、陆军、空军…</text>
  <text x="414" y="180" font-size="12" fill="#646a73">estimate.domainCount（UI 输入框：领域数 n）</text>

  <!-- 箭头 2 -->
  <line x1="684" y1="152" x2="744" y2="152" stroke="#8f959e" stroke-width="2"/>
  <polygon points="744,146 756,152 744,158" fill="#8f959e"/>
  <text x="692" y="140" font-size="12" font-weight="700" fill="#d4380d">m</text>

  <!-- m：方向 -->
  <rect x="756" y="100" width="252" height="104" rx="10" fill="#f6ffed" stroke="#389e0d" stroke-width="1.5"/>
  <text x="776" y="128" font-size="14" font-weight="700" fill="#237804">m = 每领域方向数</text>
  <text x="776" y="152" font-size="13" fill="#1f2329">海上巡逻、海上打击…</text>
  <text x="776" y="180" font-size="12" fill="#646a73">datasets.direction_count（默认 3）</text>

  <!-- 第二行：方向 -> x 问题 -->
  <line x1="882" y1="204" x2="882" y2="250" stroke="#8f959e" stroke-width="2"/>
  <polygon points="876,250 882,262 888,250" fill="#8f959e"/>
  <text x="894" y="234" font-size="12" font-weight="700" fill="#d4380d">x</text>

  <rect x="600" y="262" width="408" height="104" rx="10" fill="#e6fffb" stroke="#08979c" stroke-width="1.5"/>
  <text x="620" y="290" font-size="14" font-weight="700" fill="#006d75">x = 每方向问题数</text>
  <text x="620" y="314" font-size="13" fill="#1f2329">「在某位置有某单位巡逻，遇到…请做出规划」</text>
  <text x="620" y="342" font-size="12" fill="#646a73">datasets.questions_per_direction（默认 5）</text>

  <!-- 总量 -->
  <rect x="32" y="262" width="524" height="104" rx="10" fill="#f5f5f5" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="52" y="292" font-size="14" font-weight="700" fill="#1f2329">问题总量 = n × m × x</text>
  <text x="52" y="318" font-size="13" fill="#646a73">方向条目数 = n × m</text>
  <text x="52" y="344" font-size="12" fill="#d4380d">修复前：m 无 UI 入口、生成动作不传参 ⇒ m 恒为后端默认 3</text>

  <!-- 落库路径 -->
  <rect x="32" y="392" width="976" height="104" rx="10" fill="#fafafa" stroke="#c9cdd4" stroke-width="1.5"/>
  <text x="52" y="420" font-size="14" font-weight="700" fill="#1f2329">两个真相源（运维必读）</text>
  <text x="52" y="446" font-size="12.5" fill="#1f2329">① 创建时落库：POST /api/v1/datasets 的 directionCount / questionsPerDirection / estimate.domainCount —— worker 从这里读</text>
  <text x="52" y="468" font-size="12.5" fill="#1f2329">② 入队时可选参数：POST .../directions/generate 的 directionCount —— 只影响本次运行</text>
  <text x="52" y="488" font-size="12" fill="#d4380d">R13 的选择：只以 ①（创建时落库的值）为真相源，生成动作不在运行时传参，避免「任务页改了值但任务配置没变、重跑又回旧值」</text>
</svg>
