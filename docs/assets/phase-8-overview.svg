<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title>Phase 8 评估与清洗：五层架构与 8 条 lane 落点</title>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Phase 8 评估与清洗 · 五层架构与 lane 落点</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#6b7280">文件路径均为仓库内真实路径；灰底为 foundation 冻结的共享文件，lane 只读不改</text>

  <!-- Layer 1: web -->
  <rect x="40" y="80" width="920" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="56" y="104" font-size="15" font-weight="bold" fill="#1d4ed8">① 前端层 apps/web-user</text>
  <rect x="60" y="116" width="270" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="72" y="136" font-size="12" fill="#111827">App.tsx 导航/路由（冻结）</text>
  <text x="72" y="153" font-size="11" fill="#6b7280">/console/evaluation · /console/cleaning</text>
  <rect x="350" y="116" width="290" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="362" y="136" font-size="12" fill="#111827">views/EvaluationView.tsx（L13）</text>
  <text x="362" y="153" font-size="11" fill="#6b7280">views/CleaningView.tsx（L14）</text>
  <rect x="660" y="116" width="284" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="672" y="136" font-size="12" fill="#111827">lib/api.ts 全部函数签名（冻结）</text>
  <text x="672" y="153" font-size="11" fill="#6b7280">L13/L14 只调用，不修改</text>

  <!-- Layer 2: api -->
  <rect x="40" y="192" width="920" height="126" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="56" y="216" font-size="15" font-weight="bold" fill="#15803d">② HTTP 层 apps/api（init() 注册表，每 lane 一个文件）</text>
  <rect x="60" y="228" width="290" height="78" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="72" y="248" font-size="12" font-weight="bold" fill="#111827">路由注册表（冻结）</text>
  <text x="72" y="266" font-size="11" fill="#374151">routes.go: RegisterRoutes</text>
  <text x="72" y="283" font-size="11" fill="#374151">RegisterDatasetRouter(segment, fn)</text>
  <text x="72" y="300" font-size="11" fill="#6b7280">main.go 优先查表，未命中回退 legacy</text>
  <rect x="370" y="228" width="274" height="78" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="382" y="248" font-size="12" font-weight="bold" fill="#111827">生成类路由</text>
  <text x="382" y="266" font-size="11" fill="#374151">routes_directions.go（L1）</text>
  <text x="382" y="283" font-size="11" fill="#374151">routes_chain_standards.go（L2）</text>
  <text x="382" y="300" font-size="11" fill="#374151">routes_questions_v2.go（L3）</text>
  <rect x="660" y="228" width="284" height="78" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="672" y="248" font-size="12" font-weight="bold" fill="#111827">生成类路由（续）</text>
  <text x="672" y="266" font-size="11" fill="#374151">routes_grpo.go（L4）· routes_sft.go（L5）</text>
  <text x="672" y="283" font-size="11" fill="#374151">routes_export_formats.go（L6）</text>
  <text x="672" y="300" font-size="11" fill="#374151">routes_cleaning_*.go（L11/L12）· routes_eval_*.go（L7/L8）</text>

  <!-- Layer 3: worker -->
  <rect x="40" y="332" width="920" height="112" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="56" y="356" font-size="15" font-weight="bold" fill="#a16207">③ 异步层 apps/worker（init() 注册表，每 lane 一个 job 文件）</text>
  <rect x="60" y="368" width="290" height="64" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="72" y="388" font-size="12" font-weight="bold" fill="#111827">registry.go（冻结）</text>
  <text x="72" y="406" font-size="11" fill="#374151">RegisterJobHandler(jobType, handler)</text>
  <text x="72" y="423" font-size="11" fill="#6b7280">jobContext 汇聚 store 依赖 + SetExtra</text>
  <rect x="370" y="368" width="274" height="64" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="382" y="388" font-size="12" fill="#111827">job_directions.go · job_chain_standards.go</text>
  <text x="382" y="406" font-size="11" fill="#374151">job_questions_v2.go · job_grpo.go</text>
  <text x="382" y="423" font-size="11" fill="#374151">job_sft.go · job_export_multi.go</text>
  <rect x="660" y="368" width="284" height="64" rx="6" fill="#ffffff" stroke="#fde047"/>
  <text x="672" y="388" font-size="12" fill="#111827">job_cleaning.go（L12）</text>
  <text x="672" y="406" font-size="11" fill="#374151">L9 的评估 job（待合并）</text>
  <text x="672" y="423" font-size="11" fill="#6b7280">消费私有队列 WORKER_QUEUE_NAME</text>

  <!-- Layer 4: domain -->
  <rect x="40" y="458" width="920" height="130" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="56" y="482" font-size="15" font-weight="bold" fill="#be185d">④ 领域层 internal（纯逻辑，可单测）</text>
  <rect x="60" y="494" width="212" height="80" rx="6" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="72" y="514" font-size="12" font-weight="bold" fill="#111827">internal/llm</text>
  <text x="72" y="532" font-size="11" fill="#374151">*_generator.go（L1~L5）</text>
  <text x="72" y="549" font-size="11" fill="#374151">dedupe.go（L3）</text>
  <text x="72" y="566" font-size="11" fill="#6b7280">openai_client.go（冻结）</text>
  <rect x="288" y="494" width="200" height="80" rx="6" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="300" y="514" font-size="12" font-weight="bold" fill="#111827">internal/eval</text>
  <text x="300" y="532" font-size="11" fill="#374151">catalog.go（L8，58 维）</text>
  <text x="300" y="549" font-size="11" fill="#374151">judge.go（L7，多裁判剔除）</text>
  <text x="300" y="566" font-size="11" fill="#6b7280">scoring/sampling/aggregate（L9/L10 待合并）</text>
  <rect x="504" y="494" width="200" height="80" rx="6" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="516" y="514" font-size="12" font-weight="bold" fill="#111827">internal/cleaning</text>
  <text x="516" y="532" font-size="11" fill="#374151">keywords.go（L11，41 条）</text>
  <text x="516" y="549" font-size="11" fill="#374151">scanner.go（L12，分阶段扫描）</text>
  <rect x="720" y="494" width="224" height="80" rx="6" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="732" y="514" font-size="12" font-weight="bold" fill="#111827">internal/exporter</text>
  <text x="732" y="532" font-size="11" fill="#374151">jsonl/csv/parquet/alpaca/sharegpt</text>
  <text x="732" y="549" font-size="11" fill="#374151">mapping.go 字段映射</text>
  <text x="732" y="566" font-size="11" fill="#6b7280">queue.go 导出请求键</text>

  <!-- Layer 5: store + sql -->
  <rect x="40" y="600" width="920" height="96" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="56" y="624" font-size="15" font-weight="bold" fill="#6d28d9">⑤ 存储层 internal/store + sql/migrations</text>
  <rect x="60" y="636" width="430" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="72" y="656" font-size="12" fill="#111827">eval_store_judges.go · eval_store_dimensions.go（L7/L8）</text>
  <text x="72" y="673" font-size="11" fill="#6b7280">eval_store_items.go · eval_store_summary.go（L9/L10 待合并）</text>
  <rect x="510" y="636" width="434" height="46" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="522" y="656" font-size="12" fill="#111827">cleaning_store_keywords.go · cleaning_store_runs.go（L11/L12）</text>
  <text x="522" y="673" font-size="11" fill="#6b7280">0011_eval_core.sql · 0012_cleaning_core.sql（冻结，不得新增）</text>
</svg>
