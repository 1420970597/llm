<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title>第二轮缺陷治理：阶段路由、批处理状态推进与记录状态过滤</title>
  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>
  <text x="520" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">第二轮缺陷治理 · 三处关键语义</text>
  <text x="520" y="54" text-anchor="middle" font-size="12" fill="#6b7280">路径与符号均为仓库内真实存在；右下标「已合并 / 待合并」表示该修复在当前 main 上的真实状态</text>

  <!-- ================= Panel A: stage routes ================= -->
  <rect x="24" y="72" width="992" height="216" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="40" y="96" font-size="15" font-weight="bold" fill="#1d4ed8">A · 任务阶段页路由（#61）：状态 → 一个真实渲染的阶段页</text>
  <text x="40" y="116" font-size="11" fill="#6b7280">修复前：五个阶段路由都是 &lt;Navigate to={activeTaskDetailRoute} /&gt; 自指重定向，净位移为 0，流水线在 draft 硬阻塞</text>

  <!-- status source -->
  <rect x="44" y="132" width="180" height="60" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="58" y="154" font-size="12" font-weight="bold" fill="#111827">datasets.status</text>
  <text x="58" y="172" font-size="11" fill="#374151">App.tsx: statusToActionRoute()</text>
  <text x="58" y="187" font-size="11" fill="#6b7280">App.tsx: statusStageKey()</text>

  <path d="M224 162 L266 162" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrA)"/>
  <defs>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- five stage pages -->
  <rect x="272" y="126" width="176" height="72" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="286" y="146" font-size="12" font-weight="bold" fill="#111827">/console/domains</text>
  <text x="286" y="164" font-size="11" fill="#374151">renderDomains()</text>
  <text x="286" y="180" font-size="11" fill="#6b7280">draft · 生成方向结构</text>
  <text x="286" y="193" font-size="10" fill="#16a34a">已合并（PR #70）</text>

  <rect x="462" y="126" width="176" height="72" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="476" y="146" font-size="12" font-weight="bold" fill="#111827">/console/questions</text>
  <text x="476" y="164" font-size="11" fill="#374151">renderQuestionStage()</text>
  <text x="476" y="180" font-size="11" fill="#6b7280">domains_confirmed</text>
  <text x="476" y="193" font-size="10" fill="#16a34a">已合并（PR #70）</text>

  <rect x="652" y="126" width="176" height="72" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="666" y="146" font-size="12" font-weight="bold" fill="#111827">/console/reasoning</text>
  <text x="666" y="164" font-size="11" fill="#374151">renderReasoningStage()</text>
  <text x="666" y="180" font-size="11" fill="#6b7280">questions_generated</text>
  <text x="666" y="193" font-size="10" fill="#16a34a">已合并（PR #70）</text>

  <rect x="842" y="126" width="158" height="72" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="856" y="146" font-size="12" font-weight="bold" fill="#111827">/console/rewards</text>
  <text x="856" y="164" font-size="11" fill="#374151">renderRewardStage()</text>
  <text x="856" y="180" font-size="11" fill="#6b7280">reasoning_generated</text>
  <text x="856" y="193" font-size="10" fill="#16a34a">已合并（PR #70）</text>

  <rect x="272" y="208" width="176" height="62" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="286" y="228" font-size="12" font-weight="bold" fill="#111827">/console/exports</text>
  <text x="286" y="246" font-size="11" fill="#374151">renderExportStage()</text>
  <text x="286" y="262" font-size="10" fill="#16a34a">已合并（PR #70）</text>

  <rect x="462" y="208" width="368" height="62" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="476" y="228" font-size="12" font-weight="bold" fill="#92400e">残余缺口：stageRouteNavMap（App.tsx 约 :104-110）</text>
  <text x="476" y="246" font-size="11" fill="#78350f">仍把 domains→/console/tasks、questions/reasoning/rewards/exports→/console/results</text>
  <text x="476" y="261" font-size="10" fill="#b45309">待合并（R1）· 侧边栏与面包屑会把用户带离阶段页</text>

  <!-- ================= Panel B: batch commit ================= -->
  <rect x="24" y="302" width="600" height="222" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="40" y="326" font-size="15" font-weight="bold" fill="#b91c1c">B · 批处理状态推进时机（#5）</text>
  <text x="40" y="346" font-size="11" fill="#6b7280">Insert 的语义是「整批完成 + 推进状态」：upsert 末尾无条件 UPDATE datasets SET status</text>

  <rect x="44" y="360" width="256" height="148" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="58" y="380" font-size="12" font-weight="bold" fill="#b91c1c">✗ 修复前：循环内调用</text>
  <text x="58" y="400" font-size="11" fill="#374151">for _, question := range questions {</text>
  <text x="72" y="417" font-size="11" fill="#374151">... 逐题调用 LLM ...</text>
  <text x="72" y="434" font-size="11" font-weight="bold" fill="#b91c1c">reasoningStore.Insert(1 条记录)</text>
  <text x="58" y="451" font-size="11" fill="#374151">}</text>
  <text x="58" y="472" font-size="10" fill="#b91c1c">第 1 题写完即 UPDATE datasets.status</text>
  <text x="58" y="487" font-size="10" fill="#b91c1c">failedCount/partialCount 只看当次迭代</text>
  <text x="58" y="502" font-size="10" fill="#b91c1c">partial 被 default 分支计入 generatedCount</text>

  <rect x="316" y="360" width="292" height="148" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="330" y="380" font-size="12" font-weight="bold" fill="#15803d">✓ 修复后：循环外整批提交</text>
  <text x="330" y="400" font-size="11" fill="#374151">records := 遍历 questions 收集</text>
  <text x="330" y="417" font-size="11" fill="#374151">（内含逐题 LLM 调用与失败兜底）</text>
  <text x="330" y="440" font-size="11" font-weight="bold" fill="#15803d">reasoningStore.Insert(全部记录) ← 调用一次</text>
  <text x="330" y="462" font-size="10" fill="#16a34a">状态只在整批落库之后推进一次</text>
  <text x="330" y="477" font-size="10" fill="#16a34a">统计覆盖整批，不再从当批推断</text>
  <text x="330" y="492" font-size="10" fill="#16a34a">不变量：status 不得领先于实际记录数</text>

  <path d="M300 434 L316 434" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <text x="44" y="518" font-size="10" fill="#991b1b">代码位置：apps/worker/main.go:282、:350（循环内）· internal/store/reasoning_store.go upsert 末尾无条件推进</text>

  <!-- ================= Panel C: record status filter ================= -->
  <rect x="640" y="302" width="376" height="222" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="656" y="326" font-size="15" font-weight="bold" fill="#6d28d9">C · 记录状态与下游过滤（#7）</text>
  <text x="656" y="346" font-size="11" fill="#6b7280">status 列是 TEXT，无 CHECK 约束 → 扩展取值不需要新迁移</text>

  <rect x="660" y="358" width="150" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="674" y="378" font-size="12" font-weight="bold" fill="#15803d">generated</text>
  <text x="674" y="395" font-size="10" fill="#166534">模型正常返回且内容有效</text>

  <rect x="660" y="412" width="150" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="674" y="432" font-size="12" font-weight="bold" fill="#b91c1c">invalid</text>
  <text x="674" y="449" font-size="10" fill="#991b1b">合法 JSON 但占位/无效内容</text>

  <rect x="660" y="466" width="150" height="46" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="674" y="486" font-size="12" font-weight="bold" fill="#374151">failed</text>
  <text x="674" y="503" font-size="10" fill="#4b5563">网络/解析失败</text>

  <rect x="838" y="358" width="162" height="100" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="852" y="378" font-size="12" font-weight="bold" fill="#6d28d9">可进入下游</text>
  <text x="852" y="398" font-size="11" fill="#374151">导出（job_export_multi）</text>
  <text x="852" y="415" font-size="11" fill="#374151">评估（LoadEvalSources）</text>
  <text x="852" y="437" font-size="10" fill="#6d28d9">规则：只有 generated</text>
  <text x="852" y="452" font-size="10" fill="#6d28d9">invalid 与 failed 同等排除</text>

  <path d="M810 381 L838 381" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrB)"/>
  <path d="M810 435 L838 420" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrC)"/>
  <path d="M810 489 L838 450" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrC)"/>

  <text x="660" y="519" font-size="10" fill="#5b21b6">分开计数便于区分「网络失败」与「模型摆烂」</text>

  <!-- ================= Panel D: active run uniqueness ================= -->
  <rect x="24" y="540" width="992" height="196" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="40" y="564" font-size="15" font-weight="bold" fill="#0e7490">D · 活跃运行唯一约束（#9）：把仲裁权交给数据库</text>
  <text x="40" y="584" font-size="11" fill="#6b7280">不变量：同一 (dataset_id, stage) 同时至多一条活跃记录。活跃 = status IN ('pending','running')</text>

  <rect x="44" y="598" width="300" height="122" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="58" y="618" font-size="12" font-weight="bold" fill="#b91c1c">✗ 修复前：read-then-insert</text>
  <text x="58" y="638" font-size="11" fill="#374151">1. SELECT ActiveRun → pgx.ErrNoRows</text>
  <text x="58" y="655" font-size="11" fill="#374151">2. INSERT ... 'running'</text>
  <text x="58" y="675" font-size="10" fill="#b91c1c">两步间无互斥 → 并发各插一条</text>
  <text x="58" y="690" font-size="10" fill="#b91c1c">索引 idx_generation_runs_lookup 含 status</text>
  <text x="58" y="705" font-size="10" fill="#b91c1c">即使改 UNIQUE 也拦不住 pending/running 并存</text>

  <rect x="360" y="598" width="316" height="122" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="374" y="618" font-size="12" font-weight="bold" fill="#15803d">✓ 修复后：单语句原子 upsert</text>
  <text x="374" y="638" font-size="11" fill="#374151">INSERT ... ON CONFLICT (dataset_id, stage)</text>
  <text x="374" y="654" font-size="11" fill="#374151">  WHERE status IN ('pending','running')</text>
  <text x="374" y="670" font-size="11" fill="#374151">  DO UPDATE SET status='running',</text>
  <text x="374" y="686" font-size="11" fill="#374151">    attempts = attempts + 1, finished_at = NULL</text>
  <text x="374" y="706" font-size="10" fill="#16a34a">复用时刻意不覆盖 cursor/total_units/done_units（断点续跑进度）</text>

  <rect x="692" y="598" width="308" height="122" rx="6" fill="#ffffff" stroke="#67e8f9" stroke-width="2"/>
  <text x="706" y="618" font-size="12" font-weight="bold" fill="#0e7490">迁移 0020（幂等，先清理后建索引）</text>
  <text x="706" y="638" font-size="11" fill="#374151">sql/migrations/0020_generation_runs_active_unique.sql</text>
  <text x="706" y="656" font-size="11" fill="#374151">第 1 步：终结同组除 MAX(id) 外的活跃记录</text>
  <text x="706" y="671" font-size="10" fill="#4b5563">（转 failed 并写入来源说明，不删除：游标不可逆）</text>
  <text x="706" y="690" font-size="11" fill="#374151">第 2 步：CREATE UNIQUE INDEX IF NOT EXISTS</text>
  <text x="706" y="705" font-size="11" fill="#374151">  uniq_generation_runs_active (dataset_id, stage)</text>
  <text x="706" y="718" font-size="10" fill="#0e7490">WHERE status IN ('pending','running')</text>

  <!-- footer -->
  <text x="520" y="752" text-anchor="middle" font-size="11" fill="#9ca3af">状态标注依据：当前 main（3c8b772）实测 + 各 lane 已 push 分支的真实 diff；未合并项一律标注「待合并」</text>
</svg>
