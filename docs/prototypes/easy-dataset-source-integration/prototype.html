<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier · 素材来源原型</title><style>/* ==========================================================================
   Atelier · 素材来源（source）原型样式
   --------------------------------------------------------------------------
   所有 token 逐字取自 apps/web-user/src/styles.css 与 index.css，因此原型与
   生产界面的配色、字体、圆角、阴影一致；原型本身不进入生产构建。
   ========================================================================== */

:root {
  --bg: #faf9f6;
  --bg-strong: #f0eee9;
  --panel: rgba(255, 255, 255, 0.92);
  --panel-strong: #ffffff;
  --panel-border: #e5e3e9;
  --panel-border-strong: #d1cbe8;
  --text: #262631;
  --text-soft: #5f5f6c;
  --text-muted: #737381;
  --accent: #6554c0;
  --accent-soft: #efecfc;
  --accent-strong: #564396;
  --success: #22684e;
  --danger: #a83e44;
  --danger-soft: #f9e9ea;
  --warning: #896417;
  --rail: #f0eee9;
  --rail-border: #dfddd6;
  --ink-deep: #292631;
  --canvas: #fbfaff;
  --canvas-grid: #d9d2ef;
  --state-amber: #d79a42;
  --state-amber-soft: #fffdf7;
  --shadow: 0 18px 44px rgba(38, 38, 49, 0.08);
  --shadow-soft: 0 8px 20px rgba(38, 38, 49, 0.05);
  --ring: 0 0 0 3px rgba(101, 84, 192, 0.18);
  --header-height: 70px;
  --sidebar-width: 82px;

  font-family: Inter, 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif;
  color: var(--text);
  font-size: 14px;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
ul { margin: 0; padding: 0; list-style: none; }
pre { margin: 0; }

/* ---------- 骨架：左栏 + 顶栏 + 内容 ---------- */
.shell { display: flex; min-height: 100vh; }

.rail {
  width: var(--sidebar-width);
  flex: 0 0 var(--sidebar-width);
  background: var(--rail);
  border-right: 1px solid var(--rail-border);
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 0 18px;
  position: sticky; top: 0; height: 100vh;
}
.rail__brand {
  width: 40px; height: 40px; border-radius: 11px;
  background: var(--ink-deep); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 15px; letter-spacing: -0.03em;
  margin-bottom: 22px;
}
.rail__item {
  width: 62px; padding: 9px 0 7px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--text-muted); font-size: 11px; line-height: 1.2;
  cursor: default;
}
.rail__item svg { width: 17px; height: 17px; stroke-width: 1.7; }
.rail__item.is-active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.rail__spacer { flex: 1; }
.rail__exit {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff;
  display: grid; place-items: center;
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: var(--header-height);
  display: flex; align-items: center; gap: 16px;
  padding: 0 26px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel);
  backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 20;
}
.crumb { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
.crumb > span, .crumb > b { white-space: nowrap; }
.crumb > b { overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--text); font-weight: 600; }
.crumb__sep { opacity: 0.45; }
.topbar__spacer { flex: 1; }
.search {
  width: 190px; height: 34px; border: 1px solid var(--panel-border);
  border-radius: 8px; background: #fff; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; padding: 0 11px; font-size: 13px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
}

/* 底部留出评审导航条的空间，避免它盖住最后一屏内容。 */
.content { padding: 26px 26px 96px; max-width: 1360px; width: 100%; }

/* ---------- 项目头 ---------- */
.project-head { margin-bottom: 4px; }
.project-head h2 { font-size: 20px; }
.project-head p { margin: 5px 0 0; color: var(--text-muted); font-size: 13px; }
.workspace-tabs {
  display: flex; gap: 24px; margin: 16px 0 0;
  border-bottom: 1px solid var(--panel-border);
}
.workspace-tabs span {
  padding: 0 0 10px; color: var(--text-muted); font-size: 13.5px; position: relative;
}
.workspace-tabs span.is-active { color: var(--text); font-weight: 600; }
.workspace-tabs span.is-active::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--accent); border-radius: 2px;
}

/* ---------- 页头（eyebrow + 大标题） ---------- */
.page-head { display: flex; align-items: flex-end; gap: 18px; margin: 30px 0 20px; }
.page-head__text { flex: 1; min-width: 0; }
.eyebrow {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; margin-bottom: 12px;
}
.page-head h1 { font-size: 34px; line-height: 1.12; letter-spacing: -0.02em; }
.page-head .lede { margin: 11px 0 0; color: var(--text-muted); font-size: 13.5px; max-width: 62ch; }

/* ---------- 按钮 ---------- */
.btn {
  height: 34px; padding: 0 15px; border-radius: 7px;
  border: 1px solid var(--panel-border); background: #fff; color: var(--text);
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 500; cursor: default; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn--ghost { background: transparent; }
.btn--sm { height: 28px; padding: 0 11px; font-size: 12.5px; }

/* ---------- 卡片与栅格 ---------- */
.card {
  background: var(--panel-strong);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: var(--shadow-soft);
}
.card__head {
  padding: 13px 16px; border-bottom: 1px solid var(--panel-border);
  display: flex; align-items: center; gap: 10px;
}
.card__head h3 { font-size: 14px; }
.card__head .spacer { flex: 1; }
.card__body { padding: 16px; }
.card__body--tight { padding: 12px 14px; }

.cols { display: grid; grid-template-columns: 236px minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.cols--2 { grid-template-columns: minmax(0, 1fr) 320px; }

/* ---------- 版本台账（左栏） ---------- */
.docs { display: flex; flex-direction: column; gap: 2px; }
.docs__title {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; padding: 0 4px 9px;
}
.doc {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 9px; border-radius: 7px; font-size: 13px; color: var(--text-soft);
  border: 1px solid transparent;
}
.doc.is-active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; border-color: var(--panel-border-strong); }
.doc.is-planned { opacity: 0.5; }
.doc__mark { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.5; }
.doc__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc__ver { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.doc.is-active .doc__ver { color: var(--accent); }

/* ---------- 来源清单 ---------- */
.srclist { display: flex; flex-direction: column; }
.src {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) 78px 104px 92px;
  align-items: center; gap: 11px;
  padding: 11px 4px; border-bottom: 1px solid #f2f0f4; font-size: 13px;
}
.src:last-child { border-bottom: none; }
.src__icon { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.src__icon--pdf { background: #a83e44; }
.src__icon--docx { background: #2f5fa8; }
.src__icon--md { background: #4a4a58; }
.src__icon--zip { background: #8a8a99; }
.src__name { min-width: 0; }
.src__name b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src__name small { color: var(--text-muted); font-size: 11.5px; }
.src__num { text-align: right; color: var(--text-soft); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.src__num small { display: block; color: var(--text-muted); font-size: 10.5px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 21px; padding: 0 8px; border-radius: 11px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.pill--ok { background: rgba(34, 104, 78, 0.1); color: var(--success); }
.pill--run { background: var(--accent-soft); color: var(--accent-strong); }
.pill--bad { background: var(--danger-soft); color: var(--danger); }
.pill--warn { background: rgba(137, 100, 23, 0.11); color: var(--warning); }
.pill--mute { background: #f0eff3; color: var(--text-muted); }
.pill__dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---------- 标签树 ---------- */
.tree { padding: 2px 0; }
.tree__row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px; font-size: 13px;
}
.tree__row:hover { background: #faf9fc; }
.tree__row--l2 { padding-left: 26px; }
.tree__row--l3 { padding-left: 44px; }
.tree__caret { width: 11px; color: var(--text-muted); font-size: 10px; }
.tree__name { flex: 1; }
.tree__count { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tree__badge { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #f0eff3; color: var(--text-muted); }

/* ---------- 检查器 ---------- */
.inspector .card__head h3 { font-size: 15px; }
.field { margin-bottom: 15px; }
.field:last-child { margin-bottom: 0; }
.field__label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.field__label em { color: var(--danger); font-style: normal; margin-left: 2px; }
.field__hint { font-size: 11.5px; color: var(--text-muted); margin: 6px 0 0; line-height: 1.5; }
.input, .select {
  width: 100%; height: 34px; border: 1px solid var(--panel-border);
  border-radius: 7px; background: #fff; padding: 0 11px;
  display: flex; align-items: center; color: var(--text);
}
.select { justify-content: space-between; }
.select span:last-child { color: var(--text-muted); }
.input--num { font-variant-numeric: tabular-nums; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 5px 0; }
.check__box {
  width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--accent);
  background: var(--accent); color: #fff; display: grid; place-items: center;
  font-size: 10px; flex: 0 0 15px;
}
.check__box--off { background: #fff; border-color: #c9c6d2; }
.note {
  margin-top: 15px; padding: 11px 12px; border-radius: 8px;
  background: var(--state-amber-soft); border: 1px solid #f0e4cb;
  font-size: 12px; color: var(--warning); line-height: 1.55;
}
.note--info { background: var(--accent-soft); border-color: var(--panel-border-strong); color: var(--accent-strong); }
.inspector__foot {
  padding: 14px 16px; border-top: 1px solid var(--panel-border);
  display: flex; flex-direction: column; gap: 9px;
}
.inspector__foot .btn { justify-content: center; }

/* ---------- 版本历史（底部台账） ---------- */
.ledger {
  margin-top: 16px; display: flex; align-items: center; gap: 10px;
  padding: 11px 16px; border-radius: 9px;
  background: var(--bg-strong); border: 1px solid var(--rail-border);
  font-size: 12.5px; color: var(--text-soft); overflow: hidden;
}
.ledger__label { font-weight: 600; color: var(--text); white-space: nowrap; }
.ledger__item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.ledger__item b { font-weight: 600; }
.ledger__sep { opacity: 0.4; }

/* ---------- 导入向导 ---------- */
.steps { display: flex; align-items: center; gap: 0; margin-bottom: 22px; }
.step { display: flex; align-items: center; gap: 10px; }
.step__num {
  width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; font-weight: 700; background: #fff; border: 1.5px solid var(--panel-border); color: var(--text-muted);
}
.step.is-done .step__num { background: var(--success); border-color: var(--success); color: #fff; }
.step.is-active .step__num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step__label { font-size: 13px; color: var(--text-muted); }
.step.is-active .step__label { color: var(--text); font-weight: 600; }
.step__line { width: 54px; height: 1.5px; background: var(--panel-border); margin: 0 12px; }

.source-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.choice {
  border: 1.5px solid var(--panel-border); border-radius: 10px; padding: 16px;
  background: #fff; cursor: default;
}
.choice.is-active { border-color: var(--accent); background: var(--canvas); box-shadow: var(--ring); }
.choice__tag {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 9px;
}
.choice h4 { font-size: 14px; margin-bottom: 6px; }
.choice p { margin: 0; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th {
  text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11.5px;
  padding: 0 10px 9px; border-bottom: 1px solid var(--panel-border); white-space: nowrap;
}
table.grid td { padding: 10px; border-bottom: 1px solid #f2f0f4; vertical-align: middle; }
table.grid tr:last-child td { border-bottom: none; }
table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

/* ---------- 方向 ↔ 源材料 关联 ---------- */
.maprow {
  display: grid; grid-template-columns: minmax(0, 1fr) 118px 150px 26px;
  align-items: center; gap: 12px; padding: 10px 4px;
  border-bottom: 1px solid #f2f0f4; font-size: 13px;
}
.maprow:last-child { border-bottom: none; }
.maprow--gap { background: #fffdf7; }
.maprow__dir b { display: block; font-weight: 600; }
.maprow__dir small { color: var(--text-muted); font-size: 11.5px; }
.maprow__refs { display: flex; gap: 4px; }
.chip {
  height: 20px; padding: 0 7px; border-radius: 5px; background: #f0eff3;
  color: var(--text-soft); font-size: 11px; display: inline-flex; align-items: center;
  font-variant-numeric: tabular-nums;
}
.chip--violet { background: var(--accent-soft); color: var(--accent-strong); }
.chip--empty { background: var(--state-amber-soft); color: var(--warning); border: 1px dashed #e6d4ae; }

/* ---------- 问题生成对比 ---------- */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.compare__col h4 {
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 11px; display: flex; align-items: center; gap: 8px;
}
.compare__col--before h4 { color: var(--danger); }
.compare__col--after h4 { color: var(--success); }
.qbox {
  border: 1px solid var(--panel-border); border-radius: 9px; background: #fff;
  padding: 13px 14px; margin-bottom: 10px;
}
.qbox--bad { border-color: #eccfd1; background: #fefbfb; }
.qbox--good { border-color: #cfe3da; background: #fbfdfc; }
.qbox__q { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; line-height: 1.5; }
.qbox__meta { font-size: 11.5px; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
.qbox__meta code {
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
  background: #f4f3f7; padding: 1px 5px; border-radius: 4px;
}
.codeblock {
  background: #292631; color: #e8e6ef; border-radius: 8px; padding: 12px 14px;
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px;
  line-height: 1.65; overflow-x: auto; white-space: pre;
}
.codeblock .c { color: #8a8699; }
.codeblock .k { color: #c4b5fd; }
.codeblock .s { color: #9fd6b4; }
.codeblock .del { color: #f0a0a5; }
.codeblock .add { color: #9fd6b4; }

/* ---------- 五态网格 ---------- */
.states { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.state-card .card__head { justify-content: space-between; }
.state-card__tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 5px;
}
.skeleton {
  height: 11px; border-radius: 5px; margin-bottom: 9px;
  background: linear-gradient(90deg, #efedf3 25%, #e4e1ea 37%, #efedf3 63%);
  background-size: 400% 100%; animation: sk 1.4s ease infinite;
}
.skeleton--w40 { width: 40%; }
.skeleton--w60 { width: 60%; }
.skeleton--w75 { width: 75%; }
.skeleton--w90 { width: 90%; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

.empty {
  text-align: center; padding: 34px 20px;
}
.empty__art {
  width: 56px; height: 56px; border-radius: 15px; margin: 0 auto 15px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.empty h4 { font-size: 14.5px; margin-bottom: 7px; }
.empty p { margin: 0 auto 17px; font-size: 12.5px; color: var(--text-muted); line-height: 1.65; max-width: 40ch; }
.empty__actions { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }

.banner {
  display: flex; gap: 11px; padding: 12px 14px; border-radius: 9px;
  background: var(--danger-soft); border: 1px solid #eccfd1; color: var(--danger);
  font-size: 12.5px; line-height: 1.6;
}
.banner__icon { flex: 0 0 auto; font-weight: 700; }
.banner b { display: block; margin-bottom: 3px; }
.banner__actions { margin-top: 9px; display: flex; gap: 8px; flex-wrap: wrap; }
.banner__actions .btn { border-color: #e3bcc0; color: var(--danger); background: #fff; }

.edge-row {
  display: flex; align-items: center; gap: 11px; padding: 10px 0;
  border-bottom: 1px solid #f2f0f4; font-size: 12.5px;
}
.edge-row:last-child { border-bottom: none; }
.edge-row__label { flex: 0 0 96px; color: var(--text-muted); font-size: 11.5px; }
.edge-row__value { flex: 1; min-width: 0; }
.edge-row__value code {
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px;
  background: #f4f3f7; padding: 2px 6px; border-radius: 4px;
}
.truncate { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress {
  height: 5px; border-radius: 3px; background: #efedf3; overflow: hidden; margin-top: 7px;
}
.progress__bar { height: 100%; background: var(--accent); border-radius: 3px; }
.progress__bar--amber { background: var(--state-amber); }

/* ---------- 原型导航条（仅评审用，不属于产品） ---------- */
.demo-bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  z-index: 60; display: flex; align-items: center; gap: 3px;
  background: rgba(41, 38, 49, 0.94); border-radius: 999px; padding: 5px 7px;
  box-shadow: 0 12px 30px rgba(38, 38, 49, 0.28);
  backdrop-filter: blur(8px);
}
.demo-bar a {
  color: #d8d5e2; font-size: 11.5px; padding: 6px 11px; border-radius: 999px;
  white-space: nowrap;
}
.demo-bar a.is-active { background: var(--accent); color: #fff; font-weight: 600; }
.demo-bar__sep { width: 1px; height: 16px; background: rgba(255, 255, 255, 0.16); margin: 0 4px; }

.section-title {
  font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--text-muted); font-weight: 600; margin: 26px 0 11px;
}
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }

/* ---------- 响应式（390px） ---------- */
@media (max-width: 900px) {
  .rail { display: none; }
  .topbar { padding: 0 14px; height: 58px; gap: 10px; }
  .crumb { font-size: 12px; flex: 1; }
  .search { width: 34px; padding: 0; justify-content: center; flex: 0 0 34px; }
  .search span { display: none; }
  .content { padding: 16px 14px 96px; }
  .cols, .cols--2, .compare, .states, .source-choice { grid-template-columns: 1fr; }

};
const ORDER = ['#/s01', '#/s02', '#/s03', '#/s04', '#/s05'];

function demoBar(current) {
  return `<nav class="demo-bar">
    ${ORDER.map((h) => `<a href="${h}" class="${h === current ? 'is-active' : ''}">${ROUTES[h].title}</a>`).join('')}
    <span class="demo-bar__sep"></span>
    <a href="#/s01">原型评审稿 · 非生产界面</a>
  </nav>`;
}

// 把 HTML 字符串挂载为真实 DOM 节点。
//
// 用 DOMParser 解析再 importNode，而不是给活元素赋 innerHTML：本原型的
// 所有字符串都是本文件内的静态字面量（没有用户输入、没有外部数据插值），
// 但 DOMParser 提供了一个显式的解析边界，且不会把解析结果直接当活 DOM 执行。
function mount(target, html) {
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const nodes = Array.from(parsed.body.childNodes).map((node) => document.importNode(node, true));
  target.replaceChildren(...nodes);
}

function render() {
  const hash = location.hash || '#/s01';
  const route = ROUTES[hash] || ROUTES['#/s01'];
  const app = document.querySelector('#app');
  if (!app) return;
  mount(app, `<div class="shell">${route.render()}</div>${demoBar(hash)}`);
  document.title = `${route.title} · Atelier 素材来源原型`;
}

window.addEventListener('hashchange', render);
render();
