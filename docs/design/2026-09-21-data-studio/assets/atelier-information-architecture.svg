<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#faf9f6"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif;fill:#292631} .k{font-size:14px;letter-spacing:2px;fill:#6554c0;font-weight:700}.h{font-size:26px;font-weight:700}.b{font-size:18px;font-weight:650}.s{font-size:14px;fill:#6f6a7b}.box{fill:#fff;stroke:#ddd9e2;stroke-width:2}.violet{fill:#f0edff;stroke:#8b78dc}.line{stroke:#b4a7d6;stroke-width:3;fill:none;stroke-linecap:round}</style>
  <text x="70" y="72" class="k">ATELIER / INFORMATION ARCHITECTURE</text><text x="70" y="118" class="h">让项目上下文贯穿完整旅程</text>
  <rect x="70" y="170" width="235" height="520" rx="18" class="box"/><text x="105" y="218" class="k">WORKSPACE</text><text x="105" y="270" class="b">◷ 今日工作</text><text x="105" y="314" class="b">▦ 数据项目</text><text x="105" y="358" class="b">▱ 方案库</text><text x="105" y="402" class="b">↗ 交付库</text><path d="M100 462h175" stroke="#e4e1e8"/><text x="105" y="510" class="s">动态 · 设置 · 帮助</text><text x="105" y="568" class="s">搜索 / 快捷键 / 身份</text>
  <path d="M305 430H370" class="line"/><path d="M370 430V300H420M370 430V560H420" class="line"/>
  <rect x="420" y="180" width="440" height="240" rx="18" class="violet"/><text x="455" y="225" class="k">PROJECT CONTEXT</text><text x="455" y="275" class="h">仓储调度 · Aurora</text><text x="455" y="318" class="s">目标：可检查的约束推理训练数据</text><text x="455" y="365" class="b">概览　设计　生产　数据　质量　发布</text><text x="455" y="400" class="s">同一项目、同一版本语义、稳定 URL</text>
  <rect x="420" y="480" width="440" height="210" rx="18" class="box"/><text x="455" y="525" class="k">PROJECT OBJECTS</text><text x="455" y="570" class="b">蓝图 → 批次 → 样本版本 → 证据</text><text x="455" y="615" class="b">候选 → 数据卡 → 不可变发布</text><text x="455" y="658" class="s">清洗是质量策略；导出是发布快照</text>
  <path d="M860 300H930M860 580H930" class="line"/>
  <rect x="930" y="180" width="390" height="240" rx="18" class="box"/><text x="965" y="225" class="k">DESIGN / PRODUCTION</text><text x="965" y="275" class="b">有限语义蓝图</text><text x="965" y="320" class="b">小批试制 P03</text><text x="965" y="365" class="b">同基准 A/B 比较</text><text x="965" y="400" class="s">决定是否扩量，不自动发布</text>
  <rect x="930" y="480" width="390" height="210" rx="18" class="box"/><text x="965" y="525" class="k">QUALITY / DELIVERY</text><text x="965" y="575" class="b">三栏审阅台</text><text x="965" y="620" class="b">质量门槛与发布阻塞</text><text x="965" y="665" class="b">冻结样本、映射和证据</text>
</svg>
