  <rect x="550" y="170" width="330" height="440" rx="16" fill="#f0edff" stroke="#bdb0eb" stroke-width="2"/><text x="585" y="215" class="k">ATELIER TRANSFORMATION</text><text x="585" y="270" class="b">对象 + 证据同屏</text><text x="585" y="300" class="s">样本队列 / 内容 / 判断依据</text><text x="585" y="355" class="b">有限语义蓝图</text><text x="585" y="385" class="s">节点选择 + 右侧检查器</text><text x="585" y="440" class="b">同一基准试制比较</text><text x="585" y="470" class="s">证据支持扩量决定</text><text x="585" y="525" class="b">版本化交付</text><text x="585" y="555" class="s">manifest + 数据卡 + 固定文件</text>
