  <rect width="1400" height="720" fill="#faf9f6"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif;fill:#292631}.k{font-size:13px;letter-spacing:2px;fill:#6554c0;font-weight:700}.h{font-size:27px;font-weight:700}.b{font-size:17px;font-weight:650}.s{font-size:13px;fill:#6f6a7b}.card{fill:#fff;stroke:#ddd9e2;stroke-width:2}.arrow{stroke:#8b78dc;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
  <text x="70" y="70" class="k">RESEARCH → PRODUCT DECISIONS</text><text x="70" y="118" class="h">参考的是模式，不是复制页面</text>
  <rect x="70" y="170" width="370" height="440" rx="16" class="card"/><text x="105" y="215" class="k">PUBLIC OBSERVATION</text><text x="105" y="270" class="b">SaaSFrame · Side panel</text><text x="105" y="300" class="s">中央对象保持稳定，相关评论/检查靠近对象</text><text x="105" y="355" class="b">SaaSFrame · Flowchart</text><text x="105" y="385" class="s">流程位置可见，局部步骤可编辑</text><text x="105" y="440" class="b">shadcn · Tasks</text><text x="105" y="470" class="s">筛选、选择范围、可扫描列表</text><text x="105" y="525" class="b">Linear · UI redesign</text><text x="105" y="555" class="s">侧栏/标签/面板/专注模式共享层级</text>
