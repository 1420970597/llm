<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc"><title id="title">SFT 与 GRPO 生产及质量交付旅程</title><desc id="desc">输入训练目标与规模，确认结构，生成标准和问题，再按 SFT 或 GRPO 分流。独立评估与清洗连接到内容和导出，失败可回到运行详情续跑。</desc><defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b3d}.t{font-size:29px;font-weight:bold}.h{font-size:18px;font-weight:bold}.b{font-size:14px}.s{font-size:12px;fill:#607b73}.w{fill:white}.line{stroke:#619580;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#619580"/></marker></defs><rect width="1440" height="840" fill="#f3f7f5"/><text x="55" y="62" class="t">流程按真实产物分支，每一步都有落点</text><text x="55" y="100" class="b">生产任务负责执行；数据集负责内容；质量运行负责证据；导出负责交付。</text><text x="55" y="153" class="s">用户决定</text><text x="358" y="153" class="s">需要人工确认的节点</text><text x="670" y="153" class="s">机器执行，有运行记录</text>
<g transform="translate(55 175)"><rect width="265" height="128" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="35" class="h">01 · 定义生产目标</text><text x="20" y="69" class="b">主题 / SFT 或 GRPO</text><text x="20" y="97" class="b">n 个领域 × m 个方向 × x 个问题</text></g><path d="M320 239H356" class="line"/>
<g transform="translate(363 175)"><rect width="265" height="128" rx="10" fill="#fff4db" stroke="#dfbc76"/><text x="20" y="35" class="h">02 · 领域与方向确认</text><text x="20" y="69" class="b">生成 → 修改 → 保存 → 确认</text><text x="20" y="97" class="s">有未保存修改时不能确认</text></g><path d="M628 239H664" class="line"/>
<g transform="translate(671 175)"><rect width="265" height="128" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="35" class="h">03 · 思维标准</text><text x="20" y="69" class="b">每个方向的步骤与检查点</text><text x="20" y="97" class="s">独立编辑页 / 版本历史</text></g><path d="M936 239H972" class="line"/>
<g transform="translate(979 175)"><rect width="405" height="128" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="35" class="h">04 · 问题集</text><text x="20" y="69" class="b">每方向 x 个问题 / 难度覆盖 / 内容预览</text><text x="20" y="97" class="s">完成后直接进入训练产物，不往返总览</text></g>
<path d="M1180 303V341H390V375" class="line"/><path d="M1180 303V341H1030V375" class="line"/>
<g transform="translate(55 383)"><rect width="645" height="116" rx="10" fill="#e0f1e7" stroke="#9fc7b1"/><text x="22" y="35" class="h">05A · SFT 训练产物</text><text x="22" y="70" class="b">问题 + 思维链 + 答案</text><text x="22" y="96" class="s">检查完整性与标准对应关系，明确失败与缺失部分。</text></g>
<g transform="translate(737 383)"><rect width="647" height="116" rx="10" fill="#e6edf9" stroke="#afc2e0"/><text x="22" y="35" class="h">05B · GRPO 训练产物</text><text x="22" y="70" class="b">问题 + 教师评判提示词 + 奖励档位标准</text><text x="22" y="96" class="s">奖励档位由用户定义；不与旧 rewards 或独立 eval 混淆。</text></g>
<path d="M390 499V538H714V571" class="line"/><path d="M1030 499V538H714" class="line"/>
<g transform="translate(55 579)"><rect width="390" height="119" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="35" class="h">独立质量验证</text><text x="20" y="67" class="b">多裁判评估 → 报告 → 分歧证据</text><text x="20" y="94" class="b">清洗预览 → 命中报告 → 人工复查</text></g><path d="M453 638H510" class="line"/>
<g transform="translate(520 579)"><rect width="390" height="119" rx="10" fill="#153d39"/><text x="20" y="35" class="h w">06 · 数据集 / 样本浏览</text><text x="20" y="67" class="b w">内容、来源、质量、处置与版本</text><text x="20" y="94" class="b w">选择可交付范围</text></g><path d="M910 638H970" class="line"/>
<g transform="translate(980 579)"><rect width="404" height="119" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="35" class="h">07 · 创建导出 → 文件详情</text><text x="20" y="67" class="b">范围 / 格式 / 映射 / 完整性预检</text><text x="20" y="94" class="b">入队 → 就绪 → 下载</text></g>
<rect x="55" y="738" width="1329" height="60" rx="8" fill="#fff0e8" stroke="#e4c5b1"/><text x="78" y="774" class="b">任一阶段失败 → 运行详情（原因、影响、计数）→ 仅恢复失败范围；原始样本、已成功内容与历史交付保留。</text></svg>
