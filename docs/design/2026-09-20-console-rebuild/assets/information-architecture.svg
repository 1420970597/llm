<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="870" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc"><title id="title">训练数据工厂的新信息架构</title><desc id="desc">六个业务入口分别进入独立列表、详情、专项操作和运行报告。管理员配置与普通业务分开。</desc><defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b3d}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#627d7b}.head{font-size:19px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#577570}.white{fill:white}.line{stroke:#9bbeb1;stroke-width:2;fill:none}</style></defs><rect width="1440" height="870" fill="#f3f7f5"/><text x="55" y="62" class="title">从一个万能页面，变为可定位的工作空间</text><text x="55" y="97" class="sub">对象决定页面边界 · 列表负责查找 · 详情负责理解 · 专页负责操作 · 报告负责证据</text><rect x="55" y="132" width="1330" height="64" rx="12" fill="#163b3a"/><text x="85" y="172" class="head white">工作台</text><text x="225" y="171" class="label white">待办直接进入对象 → 失败运行 / 待复查样本 / 结构确认 / 可下载文件</text><text x="1170" y="171" class="small white">通知 · 帮助 · 账户</text><path d="M720 196V222M183 222H1247M183 222V247M449 222V247M715 222V247M981 222V247M1247 222V247" class="line"/>
<g transform="translate(55 247)"><rect width="250" height="405" rx="10" fill="white" stroke="#c9ded4"/><rect width="250" height="56" rx="10" fill="#dceee4"/><text x="20" y="35" class="head">数据集</text><text x="20" y="87" class="small">内容与交付</text><text x="20" y="130" class="label">数据集列表</text><text x="20" y="171" class="label">└ 概览 / 来源 / 质量</text><text x="20" y="213" class="label">└ 样本列表 → 样本详情</text><text x="20" y="255" class="label">└ 导出列表 → 导出详情</text><text x="20" y="297" class="label">└ 创建导出 → 下载</text><rect x="18" y="332" width="214" height="51" rx="6" fill="#f1f7f3"/><text x="29" y="353" class="small">一个样本一个地址</text><text x="29" y="374" class="small">质量证据可追溯</text></g>
<g transform="translate(321 247)"><rect width="250" height="405" rx="10" fill="white" stroke="#c9ded4"/><rect width="250" height="56" rx="10" fill="#dceee4"/><text x="20" y="35" class="head">生产任务</text><text x="20" y="87" class="small">目标、执行与恢复</text><text x="20" y="130" class="label">任务列表 → 创建向导</text><text x="20" y="171" class="label">└ 任务概览 / 当前待办</text><text x="20" y="213" class="label">└ 结构 / 标准 / 问题</text><text x="20" y="255" class="label">└ SFT 或 GRPO 产物</text><text x="20" y="297" class="label">└ 运行详情 → 失败恢复</text><rect x="18" y="332" width="214" height="51" rx="6" fill="#f1f7f3"/><text x="29" y="353" class="small">阶段之间直接前进</text><text x="29" y="374" class="small">全程保留任务上下文</text></g>
<g transform="translate(587 247)"><rect width="250" height="405" rx="10" fill="white" stroke="#c9ded4"/><rect width="250" height="56" rx="10" fill="#dceee4"/><text x="20" y="35" class="head">质量评估</text><text x="20" y="87" class="small">独立裁判与评分证据</text><text x="20" y="130" class="label">运行列表 → 新建评估</text><text x="20" y="171" class="label">└ 运行概览 / 配置</text><text x="20" y="213" class="label">└ 逐条评分 → 分歧证据</text><text x="20" y="255" class="label">└ 评估报告 → 改进</text><text x="20" y="297" class="label">└ 新建复评，历史保留</text><rect x="18" y="332" width="214" height="51" rx="6" fill="#f1f7f3"/><text x="29" y="353" class="small">报告可刷新、可收藏</text><text x="29" y="374" class="small">入口默认是运行列表</text></g>
<g transform="translate(853 247)"><rect width="250" height="405" rx="10" fill="white" stroke="#c9ded4"/><rect width="250" height="56" rx="10" fill="#dceee4"/><text x="20" y="35" class="head">数据清洗</text><text x="20" y="87" class="small">运行、命中与处置</text><text x="20" y="130" class="label">运行列表 → 新建清洗</text><text x="20" y="171" class="label">└ 阶段 / 规则 / 预览</text><text x="20" y="213" class="label">└ 报告 → 命中列表</text><text x="20" y="255" class="label">└ 上下文 → 人工复查</text><text x="20" y="297" class="label">└ 保留 / 隔离 → 交付</text><rect x="18" y="332" width="214" height="51" rx="6" fill="#f1f7f3"/><text x="29" y="353" class="small">关键词命中不等于无效</text><text x="29" y="374" class="small">原始内容与判断分开</text></g>
<g transform="translate(1119 247)"><rect width="266" height="405" rx="10" fill="white" stroke="#c9ded4"/><rect width="266" height="56" rx="10" fill="#dceee4"/><text x="20" y="35" class="head">资源库</text><text x="20" y="87" class="small">低频维护与高频复用</text><text x="20" y="130" class="label">生成模板 / 生成指令</text><text x="20" y="171" class="label">评估维度</text><text x="20" y="213" class="label">清洗规则 / 关键词</text><text x="20" y="255" class="label">导出字段映射</text><text x="20" y="297" class="label">每类：列表 → 详情 → 编辑</text><rect x="18" y="332" width="230" height="51" rx="6" fill="#f1f7f3"/><text x="29" y="353" class="small">执行页只选资源</text><text x="29" y="374" class="small">维护页说明影响范围</text></g>
<rect x="55" y="687" width="1330" height="84" rx="10" fill="#e7edef"/><text x="80" y="722" class="head">系统管理 · 仅管理员</text><text x="365" y="722" class="label">环境就绪 / 模型服务 / 结果存储 / 操作记录</text><text x="365" y="750" class="small">每项都有列表与详情；模型密钥、存储连接不混进生产任务表单。</text><text x="55" y="824" class="sub">设计稿 / 2026-09-20 · 第一阶段页面拆分复用现有接口，自动编排与版本快照按依赖分期。</text></svg>
