<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc"><title id="title">页面点击与异步状态契约</title><desc id="desc">列表到详情到专项操作，每一步都有地址和返回路径。提交后的排队、运行、成功或失败清晰呈现。</desc><defs><style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#173b3d}.t{font-size:29px;font-weight:bold}.h{font-size:18px;font-weight:bold}.b{font-size:14px}.s{font-size:12px;fill:#607b73}.line{stroke:#6b9a86;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b9a86"/></marker></defs><rect width="1440" height="570" fill="#f3f7f5"/><text x="55" y="60" class="t">点击必须产生可理解的结果</text><text x="55" y="97" class="b">每个主要页面一个职责；每个副作用都有回执；每个错误都有恢复路径。</text>
<g transform="translate(55 145)"><rect width="270" height="112" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="33" class="h">列表</text><text x="20" y="64" class="b">搜索 / 筛选 / 排序 / 选择</text><text x="20" y="91" class="s">状态保存在 query，返回可恢复</text></g><path d="M325 201H375" class="line"/>
<g transform="translate(390 145)"><rect width="270" height="112" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="33" class="h">对象详情</text><text x="20" y="64" class="b">内容 / 当前状态 / 关联证据</text><text x="20" y="91" class="s">对象 ID 在地址中，刷新不丢失</text></g><path d="M660 201H711" class="line"/>
<g transform="translate(727 145)"><rect width="270" height="112" rx="10" fill="white" stroke="#bdd6c8"/><text x="20" y="33" class="h">专项操作页</text><text x="20" y="64" class="b">创建 / 编辑 / 预览 / 范围确认</text><text x="20" y="91" class="s">字段校验、草稿和离开保护</text></g><path d="M997 201H1050" class="line"/>
<g transform="translate(1065 145)"><rect width="320" height="112" rx="10" fill="#e0f1e7" stroke="#a3cbb5"/><text x="20" y="33" class="h">运行详情 / 报告</text><text x="20" y="64" class="b">执行与产物 ID，可收藏与分享</text><text x="20" y="91" class="s">启动后即可离开，后台保持执行</text></g>
<path d="M1226 257V304H192V346" class="line"/><text x="58" y="328" class="s">运行状态</text><g transform="translate(55 360)"><rect width="255" height="83" rx="8" fill="#e8edf6"/><text x="20" y="33" class="h">排队 → 运行</text><text x="20" y="62" class="s">完成 / 总数，显示计量单位</text></g><path d="M310 401H370" class="line"/>
<g transform="translate(385 360)"><rect width="275" height="83" rx="8" fill="#e0f1e7"/><text x="20" y="33" class="h">成功</text><text x="20" y="62" class="s">查看真实产物 → 下一步 / 下载</text></g><path d="M825 304V346" class="line"/>
<g transform="translate(715 360)"><rect width="295" height="83" rx="8" fill="#fff1d9"/><text x="20" y="33" class="h">部分失败</text><text x="20" y="62" class="s">保留成功内容 → 仅恢复失败部分</text></g><path d="M1226 304V346" class="line"/>
<g transform="translate(1050 360)"><rect width="335" height="83" rx="8" fill="#fbe8e4"/><text x="20" y="33" class="h">失败 / 连接中断</text><text x="20" y="62" class="s">持久原因、影响范围、重试或配置入口</text></g><text x="55" y="515" class="b">空数据、加载中、无权限、404 是不同页面状态；不能用“回到工作台”或一闪而过的 toast 抹掉原因。</text></svg>
